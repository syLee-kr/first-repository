<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
    <link rel="stylesheet" th:href="@{/css/join.css}"/>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var idElement = document.getElementById('id');
            if (idElement) {
                idElement.addEventListener('input', checkDuplicateId);
            }
        });

        function validatePasswords() {
            var password = document.getElementById('pwd').value;
            var confirmPassword = document.getElementById('pwd2').value;

            var passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*()_+~`|}{[\]:;?><,./-=])[A-Za-z\d!@#$%^&*()_+~`|}{[\]:;?><,./-=]{8,}$/;
            if (!passwordRegex.test(password)) {
                alert('비밀 번호는 대문자, 소문자, 숫자, 특수 문자를 포함하며 최소 8자리 이상이어야 합니다.');
                return false; // 폼 제출을 중단
            }

            // 비밀번호 일치 여부 확인
            if (password !== confirmPassword) {
                alert('비밀 번호가 일치하지 않습니다. 다시 확인해 주세요.');
                return false; // 폼 제출을 중단
            }

            return true; // 폼 제출 진행
        }

        function checkDuplicateId() {
            var userId = document.getElementById('id').value;

            if (userId.trim() === "") {
                document.getElementById('idCheckMessage').textContent = '';
                return; // 아이디가 비어 있으면 중복 체크하지 않음
            }

            // AJAX 요청을 통해 아이디 중복 여부 확인
            fetch(window.location.origin + '/check-duplicate-id?userId=' + userId)
                .then(response => response.json())
                .then(data => {
                    var messageElement = document.getElementById('idCheckMessage');
                    if (data.exists) {
                        messageElement.textContent = '이미 사용 중인 아이디입니다.';
                        messageElement.style.color = 'red';
                    } else {
                        messageElement.textContent = '사용 가능한 아이디입니다.';
                        messageElement.style.color = 'green';
                    }
                })
                .catch(error => console.error('아이디 중복 확인 중 오류 발생:', error));
        }
    </script>
</head>
<body>
<div class="main">
    <div class="subMain">
        <form th:action="@{/joinOk}" method="post" th:object="${user}" onsubmit="return validatePasswords()">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <h1><a th:href="@{/main}">Pocket polio</a></h1>
            <p class="subtitle">회원가입</p>

            <div class="id">
                <label for="id">아이디</label>
                <input type="text" id="id" th:field="*{username}" placeholder="아이디" required>
                <div id="idCheckMessage"></div> <!-- 아이디 중복 여부 메시지 표시 -->
            </div>

            <div class="pwd">
                <label for="pwd">비밀번호</label>
                <input type="password" id="pwd" th:field="*{pwd}" placeholder="비밀번호" required>
            </div>

            <div class="pwd2">
                <label for="pwd2">비밀번호 확인</label>
                <input type="password" id="pwd2" placeholder="비밀번호 확인" required>
            </div>

            <div class="name">
                <label for="name">이름</label>
                <input type="text" id="name" th:field="*{name}" placeholder="이름" required>
            </div>

            <!--<div class="birthday">
                <label for="birthday">생일</label>
                <input type="date" id="birthday" th:field="*{birthday}" required>
            </div>

            <div class="email">
                <label for="email">이메일</label>
                <input type="email" id="email" th:field="*{email}" placeholder="abc@def.com" required>
            </div>

            <div class="phone">
                <label for="phone">연락처</label>
                <div class="inputBox">
                    <input type="text" id="phone" th:field="*{phone}" placeholder="연락처" required>
                    <input type="button" value="인증요청" onclick="@{}">
                </div>
            </div>

            <div class="address">
                <label for="address">주소</label>
                <input type="text" id="address" th:field="*{address}" placeholder="주소" required>
            </div>

            <div class="profileImage">
                <label for="profileImage">프로필 이미지</label>
                <input type="file" id="profileImage" th:field="*{profileImage}">
            </div>-->

            <div id="guide" style="color:#999;display:none"></div>

            <div class="submit">
                <input type="submit" class="submit-btn" value="가입하기">
            </div>
        </form>
    </div>
</div>
</body>
</html>
