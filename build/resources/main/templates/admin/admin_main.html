<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Nonage Admin</title>
  <link rel="stylesheet" href="/css/admin.css">
  <script type="text/javascript">
    function admin_check() {
      const id = document.frm.id.value.trim();
      const pwd = document.frm.pwd.value.trim();

      if (id === "") {
        alert("아이디를 입력하세요.");
        return false;
      } else if (pwd === "") {
        alert("비밀번호를 입력하세요.");
        return false;
      }

      return true;
    }
  </script>
</head>

<body>
<div id="wrap">
  <div class="clear"></div>
  <article>
    <div id="loginform">
      <form name="frm" method="post" action="/admin/login" onsubmit="return admin_check();">
        <table>
          <tr>
            <td> 아이디 </td>
            <td> <input type="text" id="workId" name="id" size="10" value="" placeholder="아이디"></td>
          </tr>
          <tr>
            <td> 비밀번호 </td>
            <td>
              <input type="password" id="workPw" name="pwd" size="10" value="" placeholder="비밀번호">
            </td>
          </tr>
          <tr align="center" >
            <td colspan="2">
              <input class="btn" type="submit" value="업무 로그인"><br><br>
              <h4 style="color:red" th:text="${message}"></h4>
            </td>
          </tr>
        </table>
      </form>
    </div>
  </article>
</div>
</body>
</html>
