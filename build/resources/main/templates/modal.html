<div th:fragment="modal">
    <div id="myModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <form th:action="@{/posts}" method="post" enctype="multipart/form-data">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="form-group" id="uploadForm">
                    <label for="image" class="file-upload-label">
                        <img th:src="@{'images/default3.png'}" class="file-upload-image" alt="업로드 이미지 선택">
                    </label>
                    <input type="file" id="image" name="imageFile" accept="image/*" required onchange="previewImage(event)" style="display: none;" />
                </div>

                <div class="image-preview-container" id="imagePreviewContainer" style="display: none;">
                    <img id="imagePreview" alt="미리보기 이미지"/>
                </div>

                <div class="form-group content-form-group">
                    <textarea id="content" name="content" placeholder="내용을 입력하세요" required></textarea>
                </div>

                <button type="submit" class="submit-button">게시</button>
            </form>
        </div>
    </div>
</div>
