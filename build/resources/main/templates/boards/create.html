<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 작성</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/board.css}">
</head>
<body>
<div class="board-write-container">
    <h2>게시글 작성</h2>
    <form th:action="@{/boards/new}" th:object="${board}" method="post">
        <div class="form-group">
            <label for="title">제목</label>
            <input type="text" id="title" name="title" th:field="*{title}" placeholder="제목을 입력하세요" required>
        </div>
        <div class="form-group">
            <label for="content">내용</label>
            <textarea id="content" name="content" th:field="*{content}" placeholder="내용을 입력하세요" rows="10" required></textarea>
        </div>
        <input type="hidden" name="member.username" th:value="${currentUser.username}">
        <div class="form-actions">
            <button type="submit">작성</button>
            <a th:href="@{/boards}" class="cancel-btn">취소</a>
        </div>
    </form>
</div>
</body>
</html>
