<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  <title>My Profile</title>
  <!-- 필요한 CSS 파일 포함 -->
  <link rel="stylesheet" type="text/css" th:href="@{/css/main.css}">
  <link rel="stylesheet" type="text/css" th:href="@{/css/shop.css}">
  <link rel="stylesheet" type="text/css" th:href="@{/css/upload.css}">
  <link rel="stylesheet" type="text/css" th:href="@{/css/menu-sidebar.css}">
  <link rel="stylesheet" type="text/css" th:href="@{/css/main-container.css}">
  <link rel="stylesheet" type="text/css" th:href="@{/css/profile.css}">
</head>
<body>
<div class="layout-container">
  <!-- 메뉴 사이드바 포함 -->
  <div class="menu_sidebar" th:insert="~{menu_sidebar :: menu_sidebar}"></div>
  <!-- 메인 컨텐츠 영역 -->
  <div id="main-container" class="main-container">
    <div class="profile-container">
      <div class="profile-image">
        <img th:src="@{${member.profileImage}}" alt="Profile Image" class="profile-img">
      </div>
      <div class="profile-details">
        <p><strong>아이디:</strong> <span th:text="${member.username}"></span></p>
        <p><strong>이 름:</strong> <span th:text="${member.name}"></span></p>
        <p><strong>이메일:</strong> <span th:text="${member.email}"></span></p>
        <p><strong>전화번호:</strong> <span th:text="${member.phone}"></span></p>
        <p><strong>주 소:</strong> <span th:text="${member.address}"></span></p>
        <p><strong>생년월일:</strong> <span th:text="${member.birthday}"></span></p>
      </div>
      <button class="edit-profile-button" onclick="location.href='/edit-profile'">프로필 수정</button>
    </div>
  </div>
</div>
<!-- 필요한 JavaScript 파일 포함 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<!-- 기타 필요한 스크립트 추가 -->
</body>
</html>
